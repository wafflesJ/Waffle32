<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Waffle32 — compile and flash ESP32</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='10' fill='%231e1e1e'/><g transform='translate(10,8) rotate(-14 15 15)' fill='none' stroke='%234FC1FF' stroke-width='3' stroke-linejoin='round'><rect x='0' y='0' width='30' height='30' rx='6'/><rect x='5' y='5' width='5' height='5' rx='1.4'/><rect x='12.5' y='5' width='5' height='5' rx='1.4'/><rect x='20' y='5' width='5' height='5' rx='1.4'/><rect x='5' y='12.5' width='5' height='5' rx='1.4'/><rect x='12.5' y='12.5' width='5' height='5' rx='1.4'/><rect x='20' y='12.5' width='5' height='5' rx='1.4'/><rect x='5' y='20' width='5' height='5' rx='1.4'/><rect x='12.5' y='20' width='5' height='5' rx='1.4'/><rect x='20' y='20' width='5' height='5' rx='1.4'/></g><g transform='translate(22,24) rotate(10 15 15)' fill='%231e1e1e' stroke='%234FC1FF' stroke-width='3' stroke-linejoin='round'><rect x='0' y='0' width='30' height='30' rx='6'/><rect x='5' y='5' width='5' height='5' rx='1.4' fill='none'/><rect x='12.5' y='5' width='5' height='5' rx='1.4' fill='none'/><rect x='20' y='5' width='5' height='5' rx='1.4' fill='none'/><rect x='5' y='12.5' width='5' height='5' rx='1.4' fill='none'/><rect x='12.5' y='12.5' width='5' height='5' rx='1.4' fill='none'/><rect x='20' y='12.5' width='5' height='5' rx='1.4' fill='none'/><rect x='5' y='20' width='5' height='5' rx='1.4' fill='none'/><rect x='12.5' y='20' width='5' height='5' rx='1.4' fill='none'/><rect x='20' y='20' width='5' height='5' rx='1.4' fill='none'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css" />
</head>
<body>

<header class="topbar">
  <button id="btn-toggle-rail" class="icon-btn" title="Toggle sidebar" aria-pressed="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><line x1="6" y1="2.5" x2="6" y2="13.5"/></svg>
  </button>
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">Waffle32</span>
  </div>
  <input id="project-name" class="project-name" value="my-project" spellcheck="false" aria-label="Project name" />
  <div class="topbar-actions">
    <button id="btn-new" class="btn btn-ghost" title="Start a blank project">New</button>
    <button id="btn-export" class="btn btn-ghost" title="Download this project as a .zip">Export .zip</button>
    <button id="btn-import" class="btn btn-ghost" title="Load a project from a .zip or files">Import</button>
    <input id="file-import-input" type="file" accept=".zip,.ino,.cpp,.c,.h,.hpp" multiple hidden />
  </div>
</header>

<main class="shell">

  <!-- Left rail: board settings + file list -->
  <aside class="rail" id="rail">
    <section class="rail-block">
      <h2>Board</h2>
      <label class="field">
        <span>Chip</span>
        <select id="board-select"></select>
      </label>
      <label class="field field-check" id="cdc-row">
        <input type="checkbox" id="cdc-check" />
        <span>USB CDC on boot</span>
      </label>
      <p class="hint" id="cdc-hint"></p>
      <label class="field">
        <span>Partition scheme</span>
        <select id="partition-select">
          <option value="default">Default (1.2MB app / 1.5MB SPIFFS)</option>
          <option value="huge_app">Huge app (3MB app, no OTA)</option>
          <option value="min_spiffs">Minimal SPIFFS (1.9MB app)</option>
          <option value="no_ota">No OTA (2MB app / 2MB SPIFFS)</option>
        </select>
      </label>
    </section>

    <section class="rail-block">
      <h2>Libraries</h2>
      <p class="hint">Arduino library names, installed by name during the build.</p>
      <div class="tag-row">
        <input id="lib-input" placeholder="e.g. ArduinoJson" spellcheck="false" />
        <button id="btn-add-lib" class="btn btn-small">Add</button>
      </div>
      <ul id="lib-list" class="tag-list"></ul>
    </section>

    <section class="rail-block rail-block-grow">
      <h2>Files</h2>
      <ul id="file-list" class="file-list"></ul>
      <div class="tag-row">
        <input id="new-file-name" placeholder="helper.cpp" spellcheck="false" />
        <button id="btn-add-file" class="btn btn-small">Add file</button>
      </div>
    </section>
  </aside>

  <!-- Main: tabs + editor -->
  <section class="editor-area">
    <div class="tabs" id="tabs"></div>
    <div id="editor-host" class="editor-host"></div>
  </section>

</main>

<!-- Bottom drawer: actions + console -->
<footer class="drawer">
  <div id="drawer-resize-handle" class="resize-handle" title="Drag to resize"></div>
  <div class="drawer-actions">
    <button id="btn-compile" class="btn btn-primary">Compile</button>
    <div class="status-light" id="build-light" data-state="idle" title="Build status"></div>
    <span class="sep" aria-hidden="true"></span>
    <button id="btn-connect" class="btn">Connect device</button>
    <button id="btn-flash" class="btn btn-primary" disabled>Flash</button>
    <button id="btn-monitor" class="btn" disabled>Monitor</button>
    <div class="progress" id="progress" hidden><div class="progress-fill" id="progress-fill"></div></div>
    <span class="sep" aria-hidden="true"></span>
    <button id="btn-clear-log" class="btn btn-ghost">Clear log</button>
  </div>
  <pre id="console" class="console" aria-live="polite"></pre>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
